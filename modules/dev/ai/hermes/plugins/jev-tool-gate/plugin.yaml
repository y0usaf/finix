name: jev-tool-gate
version: 0.1.0
description: "Append-only refusal gate for tool calls: one jev `choice` verdict on a mutating call, returned as a directive-shaped tool result. Fail-open, strike-limited, no transcript rewrite (prefix cache stays warm)."
author: y0usaf
license: AGPL-3.0-only
manifest_version: 2
provides_tools: []
provides_hooks:
  - pre_llm_call
  - pre_tool_call
tags:
  - gate
  - jev
  - cache
config_schema:
  enabled:
    type: bool
    default: true
    description: "Master switch for the gate. false makes pre_tool_call return nothing and the call always runs."
  jev_bin:
    type: str
    default: "/home/y0usaf/dev/developing/jev/jev-cli/result/bin/jev"
    description: "Path to the jev executable; the CLI resolves its own key file."
  tools:
    type: list
    default: ["terminal", "write_file", "patch", "execute_code"]
    description: "Only these tools are judged. Read-only terminal commands are skipped without a jev call."
  threshold:
    type: float
    default: 0.60
    description: "Minimum probability on jev's refusal pick for the call to be blocked."
  timeout_ms:
    type: int
    default: 2500
    description: "Per-call cap for the jev round trip; the process is hard-killed at this plus 0.5 s grace."
  max_blocks_per_turn:
    type: int
    default: 2
    description: "Strike limit: at most this many blocks in one user turn, then the gate stays shut."
  max_calls_per_session:
    type: int
    default: 40
    description: "Hard cap on jev calls in one session, so the gate can never dominate a run's cost."
  task_chars:
    type: int
    default: 1500
    description: "Characters of the turn's user message kept as the task text."
