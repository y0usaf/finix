name: jev-skill-router
version: 0.1.0
description: "Per-turn skill hint: a free token-overlap gate over the live skill catalogue, then one jev `choice` question naming the skill to load. Fail-open; injects at most one line into the user message."
author: y0usaf
license: AGPL-3.0-only
manifest_version: 2
provides_tools: []
provides_hooks:
  - pre_llm_call
tags:
  - routing
  - skills
  - jev
config_schema:
  enabled:
    type: bool
    default: true
    description: "Master switch for this plugin's hook. false makes it inject nothing."
  jev_bin:
    type: str
    default: "/home/y0usaf/dev/developing/jev/jev-cli/result/bin/jev"
    description: "Path to the jev executable; the CLI resolves its own key file."
  timeout_ms:
    type: int
    default: 2500
    description: "Per-turn cap for the jev round trip (request timeout); the turn is never delayed beyond this plus a small kill grace."
  min_candidates:
    type: int
    default: 3
    description: "Open the gate when at least this many skills lexically match the message (a single lone match also opens it)."
  max_candidates:
    type: int
    default: 12
    description: "Cap on candidate skills sent to jev."
