name: slope-line
version: 0.1.0
description: "Delegate through the `line` SBCL harness: one detached line process per dispatch, waited on through the run's trail lock, reporting the run's own stop record."
author: y0usaf
license: AGPL-3.0-only
manifest_version: 2
provides_tools:
  - line_task
provides_hooks: []
tags:
  - delegation
  - slope
config_schema:
  line_bin:
    type: str
    description: "Path to the line executable; a bare name is looked up on PATH."
  api_key_env:
    type: str
    description: "Name of the environment variable line's own config expects; never set when the parent already provides it."
  api_key_file:
    type: str
    description: "File holding the API key on one line, read only when $api_key_env is absent from the parent environment."
  state_dir:
    type: str
    description: "Override for the trails root; default <HERMES_HOME>/plugin-data/slope-line/runs."
  line_model:
    type: str
    description: "Optional `--model` passthrough for line; named line_model because `model` is a reserved settings root."
  base_url:
    type: str
    description: "Optional `--base-url` passthrough for line."
