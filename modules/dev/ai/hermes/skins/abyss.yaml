# Hermes skin — themes the CLI, the TUI, and the desktop GUI from this one file.
# Deep teal night: near-black water, cyan currents, warm-neutral ink.
# Contrast (on background #06171a): body 14.8:1, headings 14.0:1, accent 10.1:1,
# muted 5.6:1, ok/warn/error 9.9/10.9/6.7:1 — all clear WCAG AA.
name: abyss
description: Deep teal night — near-black water, cyan currents

colors:
  # Base surface. The desktop GUI derives its whole palette from it (dark because
  # its relative luminance is 0.007), and seeds the TUI status bar and CLI chrome.
  background: "#06171a"

  # Accent — the one that carries buttons, focus rings, links, headings in the GUI.
  ui_accent: "#2fd6c3"
  banner_accent: "#2fd6c3"

  # Text hierarchy.
  banner_title: "#9df0e2"   # headings / primary
  banner_text: "#d9ebe8"    # body foreground
  ui_text: "#d9ebe8"
  ui_label: "#86bdb4"       # labels, session chrome
  banner_dim: "#6f9693"     # muted / secondary

  # Structure.
  banner_border: "#2d6360"
  ui_border: "#2d6360"
  input_rule: "#2a6f6b"     # the rule above the input line
  response_border: "#2fd6c3"
  session_label: "#86bdb4"
  session_border: "#2d6360"

  # Semantic status — kept recognizably green / amber / red.
  ui_ok: "#52d68c"
  ui_warn: "#f2c14e"
  ui_error: "#ff6b7d"

  # Prompt + input.
  prompt: "#d9ebe8"

  # Fills (dark surfaces the text sits on).
  status_bar_bg: "#031014"
  voice_status_bg: "#031014"
  completion_menu_bg: "#031014"
  completion_menu_current_bg: "#10383b"
  selection_bg: "#15494c"

  # Status bar.
  status_bar_text: "#cbe4e0"
  status_bar_strong: "#9df0e2"
  status_bar_dim: "#5f8481"
  status_bar_good: "#52d68c"
  status_bar_warn: "#f2c14e"
  status_bar_bad: "#ff9350"
  status_bar_critical: "#ff6b7d"
  shell_dollar: "#2fd6c3"

  # Element-specific keys (fall back to the shared ones when unset).
  ui_tool: "#35e0c8"        # tool-call marker / tool spinner
  ui_thinking: "#6f9693"    # reasoning text

# Light polarity, for a light terminal. The TUI picks this block when the terminal is
# light; the desktop GUI derives its own light/dark from `background` above. Not merged
# with the dark block — only the keys listed here are overridden.
light_colors:
  banner_title: "#115e59"
  banner_accent: "#107a70"
  banner_dim: "#5a6f6d"
  banner_text: "#123a38"
  ui_text: "#123a38"
  ui_accent: "#0f766e"
  ui_label: "#0f766e"
  ui_ok: "#2e7d32"
  ui_warn: "#b45309"
  ui_error: "#c62828"
  prompt: "#123a38"
  input_rule: "#b7d0cd"
  banner_border: "#b7d0cd"
  ui_border: "#b7d0cd"
  response_border: "#0f766e"
  session_label: "#0f766e"
  session_border: "#b7d0cd"
  status_bar_bg: "#f2f7f6"
  status_bar_text: "#5f7270"
  status_bar_strong: "#0f766e"
  status_bar_dim: "#5a6f6d"
  status_bar_good: "#2e7d32"
  status_bar_warn: "#b45309"
  status_bar_bad: "#c2410c"
  status_bar_critical: "#b91c1c"
  completion_menu_bg: "#f2f7f6"
  completion_menu_current_bg: "#cfe8e4"
  selection_bg: "#cfe8e4"
  voice_status_bg: "#f2f7f6"
  shell_dollar: "#0f766e"

# Flavor — depth/sonar mood. Delete the block to inherit the default kawaii spinner.
spinner:
  waiting_faces: ["(◇)", "(◈)", "(◆)", "(◈)"]
  thinking_faces: ["(◇)", "(◈)", "(◆)"]
  thinking_verbs:
    - "sounding"
    - "charting the deep"
    - "dredging"
    - "tracing currents"
    - "reading the tide"
    - "listening"

tool_prefix: "┊"
